[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-d-estimation"
version = "0.2.0"
description = "Surface MLE estimator for shared rotating-shield MeasurementLog v2 data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10.7",
  "numpy>=2.3.5",
  "pytest>=9.0.1",
  "rotating-shield-simulation-runtime",
  "scipy>=1.16.3",
  "torch",
]

[project.scripts]
estimate-radiation-mle = "three_d_estimation.cli:main"
estimate-radiation = "three_d_estimation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "three_d_estimation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
rotating-shield-simulation-runtime = { path = "../Rotating-shield-simulation-runtime", editable = true }
